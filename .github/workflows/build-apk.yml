name: Build & Release Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle and cache dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Run tests and build Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyVedicInsights-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk